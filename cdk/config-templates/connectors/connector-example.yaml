# Connector configuration for Dataspace Connector on AWS
# See: https://github.com/awslabs/dataspace-connector-on-aws
#
# Create a technical user with the "Identity Wallet Management" role in the
# Cofinity-X Portal, then reference its service account ID below. The pipeline
# reads its credentials, populates the connector's EDC identity, stores the
# OAuth secret, and registers the connector for discovery.

connectorId: example
profile: production # Optional override (defaults to deployment.yaml profile)
controlPlaneCpu: 256
controlPlaneMemoryLimitMiB: 1024
dataPlaneCpu: 256
dataPlaneMemoryLimitMiB: 512
# State machine iteration intervals in milliseconds (both optional; defaults shown).
interactiveStateMachineIterationMillis: "10000" # negotiation, transfer, data-flow
backgroundStateMachineIterationMillis: "60000" # policy monitor + data-plane selector
edcStateRemovalPolicy: DESTROY # DESTROY or RETAIN
serviceAccountId: "00000000-0000-0000-0000-000000000000"

# Optional per-connector identity override. Any omitted field inherits the
# deployment.yaml portal.identity default. Set these to run this connector under
# a different company (BPNL) than the deployment default.
# portal:
#   identity:
#     participantId: "BPNL..."
#     dcpId: "did:web:..."
