# Shared infrastructure configuration for Dataspace Connector on AWS
# See: https://github.com/awslabs/dataspace-connector-on-aws

profile: development # "development" (Fargate Spot, 1 NAT) or "production" (On-Demand, 2 NATs)
vpcIpAddresses: "10.0.0.0/20"
containerInsights: true

# IAM principals allowed to call the Management and Observability APIs (IAM auth)
managementApiPrincipals:
  # - "arn:aws:iam::<account-id>:role/<role-name>"
observabilityApiPrincipals:
  # - "arn:aws:iam::<account-id>:role/<role-name>"

# Optional: custom domain for EDC API endpoints
# certificateArn: "arn:aws:acm:<region>:<account-id>:certificate/<certificate-id>"
# domainName: "edc.example.com"
# hostedZoneId: "Z0123456789ABCDEFGHIJ"

# Cofinity-X Portal integration. The pipeline reads each connector's identity
# credentials from the portal, populates its EDC config, stores the OAuth secret
# in Secrets Manager, and registers the connector for discovery.
#
# The identity values below are the deployment-wide default, from the portal's
# "Configure Your Connector" dialog. A connector can override them (see
# connectors/connector-<id>.yaml) to host multiple organizations in one deployment.
#
# Admin technical user credentials (Offer Management + Dataspace Discovery roles)
# live in AWS Secrets Manager: the first pipeline run creates an empty secret
# named <deploymentName>/portal-admin/<BPNL> per organization; populate it with
# {"clientId":"...","clientSecret":"..."} and re-run to deploy connectors.
portal:
  environment: beta # "beta" or "production"
  identity:
    trustedIssuer: "did:web:..."
    stsOauthTokenUrl: "https://..."
    stsDimUrl: "https://..."
    participantId: "BPNL..."
    dcpId: "did:web:..."
    didResolver: "https://..."
