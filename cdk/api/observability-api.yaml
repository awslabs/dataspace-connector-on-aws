openapi: 3.0.1
info:
  title: EDC API
  version: "1.0"
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
x-amazon-apigateway-request-validator: all
paths:
  /{connectorId}/control-plane/check/health:
    get:
      operationId: controlPlaneCheckHealth
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a liveness probe to determine whether the runtime is working properly.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is working properly.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/check/health
        integrationTarget: ${albArn}
  /{connectorId}/control-plane/check/liveness:
    get:
      operationId: controlPlaneGetLiveness
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a liveness probe to determine whether the runtime is working properly.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is working properly.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/check/liveness
        integrationTarget: ${albArn}
  /{connectorId}/control-plane/check/readiness:
    get:
      operationId: controlPlaneGetReadiness
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a readiness probe to determine whether the runtime is able to accept requests.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is able to accept requests.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/check/readiness
        integrationTarget: ${albArn}
  /{connectorId}/control-plane/check/startup:
    get:
      operationId: controlPlaneGetStartup
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a startup probe to determine whether the runtime has completed startup.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime has completed startup.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/check/startup
        integrationTarget: ${albArn}
  /{connectorId}/data-plane/check/health:
    get:
      operationId: dataPlaneCheckHealth
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a liveness probe to determine whether the runtime is working properly.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is working properly.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${dataPlaneDefaultAddress}/{connectorId}/api/check/health
        integrationTarget: ${albArn}
  /{connectorId}/data-plane/check/liveness:
    get:
      operationId: dataPlaneGetLiveness
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a liveness probe to determine whether the runtime is working properly.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is working properly.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${dataPlaneDefaultAddress}/{connectorId}/api/check/liveness
        integrationTarget: ${albArn}
  /{connectorId}/data-plane/check/readiness:
    get:
      operationId: dataPlaneGetReadiness
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a readiness probe to determine whether the runtime is able to accept requests.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime is able to accept requests.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${dataPlaneDefaultAddress}/{connectorId}/api/check/readiness
        integrationTarget: ${albArn}
  /{connectorId}/data-plane/check/startup:
    get:
      operationId: dataPlaneGetStartup
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Performs a startup probe to determine whether the runtime has completed startup.
      tags:
        - Application Observability
      responses:
        "200":
          description: The runtime has completed startup.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${dataPlaneDefaultAddress}/{connectorId}/api/check/startup
        integrationTarget: ${albArn}
components:
  parameters:
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
      description: Connector identifier for path-based routing
