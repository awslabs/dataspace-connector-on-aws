openapi: 3.0.1
info:
  title: EDC API
  version: "1.0"
tags:
  - description:
      The public API of the Data Plane is a data proxy enabling a data consumer to actively querydata from the provider data source (e.g. backend Rest API, internal database...) through its Data
      Planeinstance. Thus the Data Plane is the only entry/output door for the data, which avoids the provider to exposedirectly its data externally.The Data Plane public API being a proxy, it supports all
      verbs (i.e. GET, POST, PUT, PATCH, DELETE), whichcan then conveyed until the data source is required. This is especially useful when the actual data sourceis a Rest API itself.In the same manner, any
      set of arbitrary query parameters, path parameters and request body are supported (in the limits fixed by the HTTP server) and can also conveyed to the actual data source.
    name: Data Plane public API
paths:
  /{connectorId}/{any+}:
    x-amazon-apigateway-any-method:
      description: Proxy any data query, including multi-segment paths, to the Data Plane.
      operationId: proxy
      responses:
        "400":
          description: Missing access token
        "403":
          description: Access token is expired or invalid
        "500":
          description: Failed to transfer data
      tags:
        - Data Plane public API
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: ANY
        requestParameters:
          integration.request.path.any: method.request.path.any
          integration.request.path.connectorId: method.request.path.connectorId
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        uri: http://${loadBalancerDnsName}/{connectorId}/api/public/{any}
        integrationTarget: ${albArn}
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/Any"
components:
  parameters:
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
      description: Connector identifier for path-based routing
    Any:
      name: any
      in: path
      required: true
      schema:
        type: string
      description: Path forwarded to the Data Plane public API, may span several segments
