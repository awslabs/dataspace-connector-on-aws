  /{connectorId}/v3/assets:
    post:
      operationId: createAssetV3
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Creates a new asset together with a data address
      tags:
        - Asset V3
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Asset was created successfully. Returns the asset Id and created timestamp
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "409":
          description: Could not create asset, because an asset with that ID already exists
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v3/assets
        integrationTarget: ${albArn}
    put:
      operationId: updateAssetV3
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: "Updates an asset with the given ID if it exists. If the asset is not found, no further action is taken. DANGER ZONE: Note that updating assets can have unexpected results, especially for contract offers that have been sent out or are ongoing in contract negotiations."
      tags:
        - Asset V3
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Asset was updated successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request was malformed, e.g. id was null
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: Asset could not be updated, because it does not exist.
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v3/assets
        integrationTarget: ${albArn}
  /{connectorId}/v3/assets/request:
    post:
      operationId: requestAssetsV3
