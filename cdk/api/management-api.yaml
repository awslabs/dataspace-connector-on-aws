openapi: 3.0.1
info:
  title: EDC API
  version: "1.0"
x-amazon-apigateway-request-validators:
  all:
    validateRequestBody: true
    validateRequestParameters: true
x-amazon-apigateway-request-validator: all
paths:
  /{connectorId}/business-partner-groups:
    post:
      operationId: createEntryV1
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Creates an entry for a particular BPN
      tags:
        - Business Partner Group
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: The object was successfully created
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "409":
          description: An entry already exists for that BPN
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/business-partner-groups
        integrationTarget: ${albArn}
    put:
      operationId: updateEntryV1
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Updates the entry for a particular BPN
      tags:
        - Business Partner Group
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: The object was successfully updated
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: No entry for the given BPN was found
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: PUT
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/business-partner-groups
        integrationTarget: ${albArn}
  /{connectorId}/business-partner-groups/{bpn}:
    get:
      operationId: resolveV1
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: bpn
          required: true
          schema:
            type: string
      description: Resolves all groups for a particular BPN
      tags:
        - Business Partner Group
      responses:
        "200":
          description: An object containing an array with the assigned groups
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
