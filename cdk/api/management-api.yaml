  /{connectorId}/v3/assets/{id}:
    get:
      operationId: getAssetV3
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: Gets an asset with the given ID
      tags:
        - Asset V3
      responses:
        "200":
          description: The asset
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request was malformed, e.g. id was null
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: An asset with the given ID does not exist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.id: method.request.path.id
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v3/assets/{id}
        integrationTarget: ${albArn}
    delete:
      operationId: removeAssetV3
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: id
          required: true
          schema:
            type: string
      description: "Removes an asset with the given ID if possible. Deleting an asset is only possible if that asset is not yet referenced by a contract agreement, in which case an error is returned. DANGER ZONE: Note that deleting assets can have unexpected results, especially for contract offers that have been sent out or ongoing or contract negotiations."
      tags:
        - Asset V3
      responses:
        "204":
          description: Asset was deleted successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request was malformed, e.g. id was null
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: An asset with the given ID does not exist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "409":
          description: The asset cannot be deleted, because it is referenced by a contract agreement
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.id: method.request.path.id
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v3/assets/{id}
        integrationTarget: ${albArn}
