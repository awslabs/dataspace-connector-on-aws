        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.bpn: method.request.path.bpn
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/business-partner-groups/{bpn}
        integrationTarget: ${albArn}
    delete:
      operationId: deleteEntryV1
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: bpn
          required: true
          schema:
            type: string
      description: Deletes the entry for a particular BPN
      tags:
        - Business Partner Group
      responses:
        "204":
          description: The object was successfully deleted
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: No entry for the given BPN was found
          content:
            application/json:
              schema:
                type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.bpn: method.request.path.bpn
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/business-partner-groups/{bpn}
        integrationTarget: ${albArn}
  /{connectorId}/v2/edrs:
    post:
      operationId: initiateEdrNegotiationV2
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Initiates an EDR negotiation by handling a contract negotiation first and then a transfer process for a given offer and with the given counter part. Please note that successfully invoking this endpoint only means that the negotiation was initiated.
      tags:
        - Control Plane EDR Api
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The negotiation was successfully initiated.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request body was malformed
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: POST
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v2/edrs
        integrationTarget: ${albArn}
  /{connectorId}/v2/edrs/request:
    post:
      operationId: requestEdrEntriesV2
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
      description: Request all Edr entries according to a particular query
      tags:
        - Control Plane EDR Api
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The edr entries matching the query
