        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v2/edrs/request
        integrationTarget: ${albArn}
  /{connectorId}/v2/edrs/{transferProcessId}:
    delete:
      operationId: removeEdrEntryV2
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: transferProcessId
          required: true
          schema:
            type: string
      description: Removes an EDR entry given the transfer process ID
      tags:
        - Control Plane EDR Api
      responses:
        "204":
          description: EDR entry was deleted successfully
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request was malformed, e.g. id was null
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: An EDR entry with the given ID does not exist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: DELETE
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.transferProcessId: method.request.path.transferProcessId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v2/edrs/{transferProcessId}
        integrationTarget: ${albArn}
  /{connectorId}/v2/edrs/{transferProcessId}/dataaddress:
    get:
      operationId: getEdrEntryDataAddressV2
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - in: path
          name: transferProcessId
          required: true
          schema:
            type: string
        - in: query
          name: auto_refresh
          required: false
          schema:
            type: string
      description: Gets the EDR data address with the given transfer process ID
      tags:
        - Control Plane EDR Api
      responses:
        "200":
          description: The data address
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Request was malformed, e.g. id was null
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "404":
          description: An EDR data address with the given transfer process ID does not exist
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      x-amazon-apigateway-auth:
        type: AWS_IAM
      x-amazon-apigateway-integration:
        type: http_proxy
        httpMethod: GET
        connectionId: ${vpcLinkId}
        connectionType: VPC_LINK
        requestParameters:
          integration.request.path.connectorId: method.request.path.connectorId
          integration.request.path.transferProcessId: method.request.path.transferProcessId
        uri: http://${loadBalancerDnsName}/{connectorId}/api/management/v2/edrs/{transferProcessId}/dataaddress
