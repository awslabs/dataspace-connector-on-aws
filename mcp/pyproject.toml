[project]
name = "dataspace-connector-mcp"
version = "0.1.0"
description = "MCP server for Eclipse Dataspace Components (EDC) Management API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "boto3>=1.43.117",
]

[project.scripts]
dataspace-connector-mcp = "server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
